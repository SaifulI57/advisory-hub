
name: Sync Vulnerability Databases

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync GitHub Advisory Database
        env:
          GH_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
        run: gh api --method POST repos/SaifulI57/advisory-database/merge-upstream -f branch=main

      - name: Sync CVE List V5
        env:
          GH_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
        run: gh api --method POST repos/SaifulI57/cvelistV5/merge-upstream -f branch=main
